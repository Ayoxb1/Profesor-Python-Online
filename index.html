<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Profesor Python y El Misterio de la Alcantarilla</title>
  
  <!-- CheerpJ 3 Official Loader Script -->
  <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #151d2f 0%, #080c14 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }

    header {
      margin-bottom: 14px;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Contenedor principal del juego */
    #game-wrapper {
      position: relative;
      width: 1024px;
      height: 768px;
      max-width: 96vw;
      max-height: 80vh;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 30px rgba(56, 189, 248, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Contenedor del display montado por CheerpJ */
    #cheerpj-display {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pantalla de carga superpuesta */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.5s ease;
      padding: 24px;
      text-align: center;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid #1e293b;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 1rem;
      color: #cbd5e1;
      font-weight: 500;
      min-height: 24px;
    }

    /* Barra de progreso visual */
    .progress-bar-container {
      width: 280px;
      height: 8px;
      background: #1e293b;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 9999px;
      transition: width 0.4s ease;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    #error-box {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      max-width: 550px;
      margin-top: 10px;
      line-height: 1.5;
      text-align: left;
    }

    /* Barra de control inferior */
    footer {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #334155;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>El Profesor Python y El Misterio de la Alcantarilla</h1>
    <p class="subtitle">Aventura Gráfica interactiva en Java ejecutada en navegador vía CheerpJ 3 (WebAssembly)</p>
  </header>

  <div id="game-wrapper">
    <!-- Pantalla de carga y estado -->
    <div id="loading-screen">
      <div class="spinner" id="spinner"></div>
      <p id="loading-text">Conectando con el motor WebAssembly...</p>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div id="error-box"></div>
    </div>

    <!-- Canvas de CheerpJ -->
    <div id="cheerpj-display"></div>
  </div>

  <footer>
    <button class="btn" id="btn-fullscreen" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>
    <a class="btn" href="https://github.com/Ayoxb1/Profesor-Python-Online" target="_blank" rel="noopener">
      ⭐ Repositorio GitHub
    </a>
  </footer>

  <script>
    function updateProgress(percent, text) {
      const progressBar = document.getElementById("progress-bar");
      const statusText = document.getElementById("loading-text");
      if (progressBar) progressBar.style.width = percent + "%";
      if (statusText) statusText.innerText = text;
    }

    async function waitForCheerpJ() {
      let attempts = 0;
      while (typeof cheerpjInit !== "function" && attempts < 50) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
      }
      if (typeof cheerpjInit !== "function") {
        throw new Error(
          "No se pudo cargar el script de CheerpJ 3 (cj3loader.js). " +
          "Si usas Brave o extensiones ad-block, desactiva temporalmente los 'Escudos de Brave' para este sitio."
        );
      }
    }

    async function initGame() {
      const loadingScreen = document.getElementById("loading-screen");
      const errorBox = document.getElementById("error-box");
      const spinner = document.getElementById("spinner");
      const displayContainer = document.getElementById("cheerpj-display");

      try {
        updateProgress(20, "Descargando motor CheerpJ 3...");
        await waitForCheerpJ();

        updateProgress(45, "Inicializando máquina virtual Java...");
        await cheerpjInit();

        updateProgress(70, "Preparando lienzo visual AWT/Swing...");
        cheerpjCreateDisplay(1024, 768, displayContainer);

        // Ocultar pantalla de carga automáticamente tan pronto como CheerpJ inserte el canvas
        const observer = new MutationObserver(() => {
          if (displayContainer.children.length > 0) {
            updateProgress(100, "¡Listo! Iniciando juego...");
            setTimeout(() => {
              loadingScreen.style.opacity = "0";
              setTimeout(() => {
                loadingScreen.style.display = "none";
              }, 400);
            }, 600);
            observer.disconnect();
          }
        });
        observer.observe(displayContainer, { childList: true, subtree: true });

        updateProgress(85, "Cargando juego.jar y recursos...");
        
        // Ejecutar el JAR ubicado en la raíz del servidor web
        const exitCodePromise = cheerpjRunJar("/app/juego.jar");

        // Respaldo de seguridad si el observer no saltase por cualquier motivo
        setTimeout(() => {
          if (loadingScreen.style.display !== "none") {
            loadingScreen.style.opacity = "0";
            setTimeout(() => {
              loadingScreen.style.display = "none";
            }, 400);
          }
        }, 5000);

        await exitCodePromise;
      } catch (err) {
        console.error("Error al ejecutar el juego:", err);
        spinner.style.display = "none";
        document.getElementById("loading-text").innerText = "No se pudo iniciar el juego.";
        errorBox.style.display = "block";
        errorBox.innerHTML = `<strong>Detalle del error:</strong> ${err.message || err}<br/><br/>
        <em>Si el error persiste, comprueba la consola de desarrollador (F12) para más detalles.</em>`;
      }
    }

    function toggleFullScreen() {
      const elem = document.getElementById("game-wrapper");
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
          alert(`No se pudo activar pantalla completa: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    window.addEventListener("DOMContentLoaded", initGame);
  </script>
</body>
</html>
