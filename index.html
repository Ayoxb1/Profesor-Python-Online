<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Profesor Python y El Misterio de la Alcantarilla</title>
  
  <!-- CheerpJ 3 WebAssembly Java Virtual Machine Loader -->
  <script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #151d2f 0%, #080c14 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }

    header {
      margin-bottom: 14px;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Contenedor principal del juego */
    #game-wrapper {
      position: relative;
      width: 1024px;
      height: 768px;
      max-width: 96vw;
      max-height: 80vh;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 30px rgba(56, 189, 248, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Contenedor del display montado por CheerpJ */
    #cheerpj-display {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pantalla de carga superpuesta */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
      padding: 24px;
      text-align: center;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 1rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    #error-box {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px 18px;
      border-radius: 6px;
      font-size: 0.85rem;
      max-width: 500px;
      margin-top: 10px;
      line-height: 1.4;
    }

    /* Barra de control inferior */
    footer {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #334155;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>El Profesor Python y El Misterio de la Alcantarilla</h1>
    <p class="subtitle">Aventura Gráfica interactiva en Java ejecutada en navegador vía CheerpJ 3 (WebAssembly)</p>
  </header>

  <div id="game-wrapper">
    <!-- Pantalla de carga y estado -->
    <div id="loading-screen">
      <div class="spinner" id="spinner"></div>
      <p id="loading-text">Iniciando entorno WebAssembly...</p>
      <div id="error-box"></div>
    </div>

    <!-- Canvas de CheerpJ -->
    <div id="cheerpj-display"></div>
  </div>

  <footer>
    <button class="btn" id="btn-fullscreen" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>
    <a class="btn" href="https://github.com/Ayoxb1/Aventura-Grafica-Profesor-Python" target="_blank" rel="noopener">
      ⭐ Repositorio GitHub
    </a>
  </footer>

  <script>
    async function initGame() {
      const statusText = document.getElementById("loading-text");
      const loadingScreen = document.getElementById("loading-screen");
      const errorBox = document.getElementById("error-box");
      const spinner = document.getElementById("spinner");
      const displayContainer = document.getElementById("cheerpj-display");

      try {
        statusText.innerText = "Inicializando máquina virtual Java (CheerpJ 3)...";
        
        await cheerpjInit({
          version: 17,
          status: "none"
        });

        statusText.innerText = "Preparando canvas gráfico...";
        cheerpjCreateDisplay(1024, 768, displayContainer);

        statusText.innerText = "Cargando juego.jar...";

        // Ejecutar el JAR ubicado en la raíz del servidor web (/app/juego.jar)
        const exitCodePromise = cheerpjRunJar("/app/juego.jar");

        // Ocultar overlay de carga tras inicialización gráfica
        setTimeout(() => {
          loadingScreen.style.opacity = "0";
          setTimeout(() => {
            loadingScreen.style.display = "none";
          }, 400);
        }, 1200);

        await exitCodePromise;
      } catch (err) {
        console.error("Error al ejecutar el juego:", err);
        spinner.style.display = "none";
        statusText.innerText = "No se pudo iniciar el juego.";
        errorBox.style.display = "block";
        errorBox.innerHTML = `<strong>Detalle del error:</strong> ${err.message || err}<br/><br/>
        Asegúrate de que <code>juego.jar</code> está subido en la raíz de la web y que los encabezados COOP/COEP están activos.`;
      }
    }

    function toggleFullScreen() {
      const elem = document.getElementById("game-wrapper");
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
          alert(`No se pudo activar pantalla completa: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    window.addEventListener("DOMContentLoaded", initGame);
  </script>
</body>
</html>
